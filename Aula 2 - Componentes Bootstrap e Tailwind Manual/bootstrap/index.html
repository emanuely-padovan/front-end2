<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechFood — Sabor & Saber</title>

  <!-- Bootstrap 5.3 CSS via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Estruturação da Barra de Navegação - Componetes -->
  <nav class="navbar navbar-expand-lg bg-danger navbar-dark">
    <div class="container"> <!-- Comandos pré-definidos, como margem, padding... -->
        <a class="navbar-brand fw-bold fs-4" href="#">🍽️ Sabooor &amp; Saber 🙊🙈🙉</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Menu"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="#cardapio">Cardápio</a></li>
            <li class="nav-item"><a class="nav-link" href="#contato">Contato</a></li>
          </ul>
        </div>
    </div>
  </nav>

  <main class="container my-5">
    <h2 class="text-center mb-4">Nosso Cardápio</h2>
    <section id="cardapio" class="row g-3">
    </section>

    <hr class="my-5">
    <section id="contato" class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <h2 class="text-center mb-4">Fale conosco</h2>
         <form>
          <div class="mb-3">
            <label class="form-label">Seu nome: </label>
            <input type="text" class="form-control" placeholder="Nome completo...">
          </div>

          <div>
            <label class="form-label">Seu email: </label>
            <input type="email" class="form-control" placeholder="nome@email.com">
          </div>

          <div>
            <label class="form-label">Seu mensagem: </label>
            <textarea class="form-control" rows="4" placeholder="Sua mensagem..."></textarea>
          </div>

          <button type="button" class="btn btn-danger w-100">Enviar🐸</button>
         </form>
      </div>
    </section>

  </main>

    <div class="modal fade" id="modalPrato" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header bg-danger text-white">
            <h5 class="modal-title" id="modalNome"></h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
            <div class="modal-body">
              <p class="text-muted mb-1" id="modalCategoria"></p>
              <p class="fs-4 fw-bold text-success mb-3" id="modalPreco"></p>
              <p id="modalDescricao"></p>
            </div>
          <!-- Footer -->
           <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary">Fechar✖️</button>
            <button type="button" class="btn btn-danger">Pedir Agora🤯</button>
           </div>
        </div>
      </div>
    </div>

  <!--
    LIVE CODE — PASSO 5: JS DO BOOTSTRAP
    Necessário para Navbar hambúrguer e Modal funcionarem.
    Adicionar antes do </body>:
  -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script src="script.js" defer></script>
</body>
</html>
